<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>AL-Araby Oils — Storefront Demo</title>
    <meta name="title" content="AL-Araby Oils — Storefront Demo" />
    <meta name="description" content="Explore a sample catalogue for oils, herbs, and personal care with search, filters, and a local cart." />
    <meta name="author" content="Alaraby Oils" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#3d8b71" />
    
    <!-- Open Graph / Facebook -->
    <!-- The build supplies an absolute URL for social previews on each host. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="AL-Araby Oils — Storefront Demo" />
    <meta property="og:description" content="Explore a sample catalogue for oils, herbs, and personal care with search, filters, and a local cart." />
    <meta property="og:site_name" content="Alaraby Oils" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Amber glass bottles of Argan and Rose oil on green marble with rosemary and lavender" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AL-Araby Oils — Storefront Demo" />
    <meta name="twitter:description" content="Explore a sample catalogue for oils, herbs, and personal care with search, filters, and a local cart." />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />
    <meta name="twitter:image:alt" content="Amber glass bottles of Argan and Rose oil on green marble with rosemary and lavender" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Pre-mount loading indicator. Tailwind supplies .sr-only once the app
         stylesheet lands; only what has to work *before* that lives here. -->
    <style>
      body { margin: 0; }

      #app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: hsl(35 40% 96%);
      }
      
      #app-loading .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid hsl(35 15% 85%);
        border-top-color: hsl(162 45% 35%);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    
    <div id="root">
      <div id="app-loading" role="status" aria-live="polite" aria-label="Loading Alaraby Oils">
        <div class="spinner"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
